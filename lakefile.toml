name = "CollatzND"
defaultTargets = ["CollatzProof", "CollatzND"]

# Mathlib is pinned to the version used by Mazur's formalization (Lean v4.30.0-rc2).
# The package name matches lake-manifest.json (copied unchanged from the source repository).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.30.0-rc2"

# L. Mazur, "Natural-density Collatz descent in logarithmic time" (ProofAtlas, commit ca3dd0d, Apache-2.0).
# Not redistributed here: fetch_mazur.py downloads it, checks SHA-256 hashes, and unpacks it into vendor/mazur.
# Only the import closure of Erdos1135.ND.RhinPhaseGap is built (it is used by CollatzND.Rhin).
[[lean_lib]]
name = "Erdos1135"
srcDir = "vendor/mazur"
globs = ["Erdos1135.+"]

[[lean_lib]]
name = "FormalConjectures"
srcDir = "vendor/mazur"
globs = ["FormalConjectures.+"]

# The M1 formalization of this project: basic definitions (the shortcut map T, the dual Terras identity),
# the minimal-endpoint fibers, and the proof of M1 (CollatzProof.M1.*). Main theorems under Bugeaud (2002),
# Theorem 1 (the hypothesis Collatz.M1.Bugeaud.Thm1G1 8): Collatz.M1.m1_main_thm1 (qualitative) and
# Collatz.M1.m1_v3, Collatz.M1.m1_v3_06 (explicit values, file CollatzProof/M1/ExplicitV3.lean); under Theorem 2
# (the hypothesis Collatz.M1.BugeaudHyp, the route of revision r6): Collatz.M1.m1_main and the explicit values
# of revision r6, Collatz.M1.m1_explicit_06 (file CollatzProof/M1/Explicit.lean). The stopping-time versions in
# CollatzProof take the Rhin-type bound RhinHyp as a hypothesis.
[[lean_lib]]
name = "CollatzProof"
srcDir = "."
globs = ["CollatzProof.Core.Defs", "CollatzProof.Defs", "CollatzProof.Fiber", "CollatzProof.M1.+"]

# Discharging RhinHyp with Mazur's Rhin-type phase gap. CollatzND.M1ExplicitV3: the stopping-time statements
# under Bugeaud (2002), Theorem 1 only (m1_sigma_thm1, m1_sigma_v3, m1_sigma_v3_06, m1_divergent_thm1,
# m1_divergent_v3). CollatzND.M1Sigma: those of revision r6 under Theorem 2 only (m1_sigma, m1_divergent).
# CollatzND.M1Explicit: the explicit values of revision r6, formalized since then, also under Theorem 2 only
# (m1_sigma_explicit_06, m1_sigma_explicit, m1_divergent_explicit).
[[lean_lib]]
name = "CollatzND"
globs = ["CollatzND.Rhin", "CollatzND.M1Sigma", "CollatzND.M1Explicit", "CollatzND.M1ExplicitV3"]
